# Baut die iPhone-App (spiel/) auf einem Mac von GitHub – ganz ohne eigenen Mac.
# - Bei jedem Push: Probe-Build ohne Signatur (zeigt, ob alles kompiliert).
# - Von Hand gestartet (Actions → iOS-App → Run workflow): signieren und zu TestFlight hochladen.
#   Dafür müssen die Secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 und APPLE_TEAM_ID gesetzt sein (siehe spiel/README.md).
name: iOS-App

on:
  push:
    paths:
      - 'spiel/**'
      - '.github/workflows/ios-app.yml'
  workflow_dispatch:
    inputs:
      upload:
        description: 'Zu TestFlight hochladen'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.ref }}-${{ github.event_name }}
  # Probe-Builds dürfen sich gegenseitig abbrechen, ein laufender Upload nie.
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  ios:
    # macOS 15 ist sofort verfügbar; Xcode 26.3 wird unten ausgewählt.
    # Apple nimmt seit April 2026 nur noch Builds mit Xcode 26 oder neuer an.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HAS_SIGNING: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.upload }}
    defaults:
      run:
        working-directory: spiel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: spiel/package-lock.json

      - name: Xcode 26 auswählen
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Spiel ins Xcode-Projekt kopieren
        run: npx cap sync ios

      - name: Versionsnummern festlegen
        run: |
          echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          # Build-Nummer steigt immer: neuer Lauf → run_number, erneuter Versuch → run_attempt
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      # Archiv OHNE Signatur: braucht weder Entwickler-Zertifikat noch registriertes iPhone.
      # Signiert wird erst beim Hochladen mit Apples Cloud-Zertifikat.
      # (Die App hat keine Entitlements. Kommen später Game Center, Push o. Ä. dazu, ad-hoc signieren:
      #  CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES PROVISIONING_PROFILE_SPECIFIER="")
      - name: Archiv bauen (ohne Signatur)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 40

      - name: Archiv prüfen
        run: |
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          PB=/usr/libexec/PlistBuddy
          for key in CFBundleIdentifier CFBundleDisplayName CFBundleShortVersionString CFBundleVersion MinimumOSVersion; do
            echo "$key = $($PB -c "Print :$key" "$APP/Info.plist")"
          done
          test "$($PB -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$APP_VERSION"
          test "$($PB -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$BUILD_NUMBER"
          for f in index.html datenschutz.html support.html icons/icon-512.png; do
            test -f "$APP/public/$f" || { echo "::error::$f fehlt in der App"; exit 1; }
          done
          echo "Spieldateien in der App: OK"

      - name: Secrets prüfen
        if: ${{ env.UPLOAD == 'true' && env.HAS_SIGNING != 'true' }}
        run: |
          echo "::error::Es fehlen Secrets. Benötigt: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID (siehe spiel/README.md)."
          exit 1

      - name: Signieren und zu TestFlight hochladen
        if: ${{ env.UPLOAD == 'true' && env.HAS_SIGNING == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/App.xcarchive"
          EXPORT_OPTS="$RUNNER_TEMP/ExportOptions.plist"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$KEY_PATH"
          trap 'rm -f "$KEY_PATH"' EXIT

          # Export-Optionen: App Store Connect, automatische Signatur (Zertifikat liegt in Apples Cloud), direkt hochladen
          cat > "$EXPORT_OPTS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$EXPORT_OPTS"

          # Mit Apples Cloud-Zertifikat signieren und zu App Store Connect / TestFlight hochladen
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$EXPORT_OPTS" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          {
            echo "### ✅ Version $APP_VERSION (Build $BUILD_NUMBER) wurde zu App Store Connect hochgeladen"
            echo "In ca. 10–30 Minuten erscheint er in TestFlight."
          } >> "$GITHUB_STEP_SUMMARY"
