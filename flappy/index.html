<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Flappy Vogel</title>
<style>
  html,body{margin:0;height:100%;background:#4ec0ca;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif}
  canvas{display:block;margin:0 auto;height:100%;max-width:100%}
</style>
</head>
<body>
<canvas id="c" width="360" height="640"></canvas>
<script>
const c = document.getElementById('c'), x = c.getContext('2d');
const W = 360, H = 640, GROUND = 580;
const GRAVITY = 0.45, FLAP = -7.5, GAP = 150, PIPE_W = 60, SPEED = 2.6;
let bird, pipes, score, state, frame;
let best = 0;
try { best = +localStorage.getItem('flappyBest') || 0; } catch (e) {}

function reset() {
  bird = { y: H / 2, v: 0 };
  pipes = []; score = 0; frame = 0; state = 'ready';
}

function flap() {
  if (state === 'over') { if (frame > 30) reset(); return; }
  state = 'play'; bird.v = FLAP; beep(600, 0.05);
}

// Kleine Sounds ohne Dateien
let ac;
function beep(f, d) {
  try {
    ac = ac || new AudioContext();
    const o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = f; g.gain.value = 0.05;
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}

function die() {
  state = 'over'; frame = 0; beep(150, 0.3);
  if (score > best) { best = score; try { localStorage.setItem('flappyBest', best); } catch (e) {} }
  if (navigator.vibrate) navigator.vibrate(80);
}

function update() {
  frame++;
  if (state === 'ready') { bird.y = H / 2 + Math.sin(frame / 10) * 6; return; }
  if (state === 'over') { if (bird.y < GROUND - 12) { bird.v += GRAVITY; bird.y += bird.v; } return; }

  bird.v += GRAVITY; bird.y += bird.v;
  if (frame % 90 === 0) pipes.push({ x: W, top: 80 + Math.random() * (GROUND - GAP - 160), scored: false });

  for (const p of pipes) {
    p.x -= SPEED;
    if (!p.scored && p.x + PIPE_W < 80) { p.scored = true; score++; beep(900, 0.08); }
    const hitX = 80 + 14 > p.x && 80 - 14 < p.x + PIPE_W;
    const hitY = bird.y - 12 < p.top || bird.y + 12 > p.top + GAP;
    if (hitX && hitY) die();
  }
  pipes = pipes.filter(p => p.x > -PIPE_W);
  if (bird.y + 12 > GROUND || bird.y < 0) die();
}

function text(t, y, size) {
  x.font = `bold ${size}px system-ui`; x.textAlign = 'center';
  x.lineWidth = 6; x.strokeStyle = '#000'; x.fillStyle = '#fff';
  x.strokeText(t, W / 2, y); x.fillText(t, W / 2, y);
}

function draw() {
  x.fillStyle = '#4ec0ca'; x.fillRect(0, 0, W, H);
  // Rohre
  for (const p of pipes) {
    x.fillStyle = '#73bf2e'; x.strokeStyle = '#2d5a10'; x.lineWidth = 3;
    x.fillRect(p.x, 0, PIPE_W, p.top); x.strokeRect(p.x, -3, PIPE_W, p.top + 3);
    x.fillRect(p.x, p.top + GAP, PIPE_W, GROUND - p.top - GAP); x.strokeRect(p.x, p.top + GAP, PIPE_W, GROUND - p.top - GAP);
  }
  // Boden
  x.fillStyle = '#ded895'; x.fillRect(0, GROUND, W, H - GROUND);
  x.fillStyle = '#73bf2e'; x.fillRect(0, GROUND, W, 12);
  // Vogel
  x.save(); x.translate(80, bird.y); x.rotate(Math.max(-0.5, Math.min(1.2, bird.v / 10)));
  x.fillStyle = '#f7d51d'; x.beginPath(); x.arc(0, 0, 14, 0, 7); x.fill(); x.stroke();
  x.fillStyle = '#fff'; x.beginPath(); x.arc(6, -5, 5, 0, 7); x.fill();
  x.fillStyle = '#000'; x.beginPath(); x.arc(8, -5, 2, 0, 7); x.fill();
  x.fillStyle = '#f75c1d'; x.fillRect(10, 1, 10, 5);
  x.restore();

  if (state !== 'ready') text(score, 90, 56);
  if (state === 'ready') { text('Flappy Vogel', 200, 44); text('Tippen zum Fliegen', 400, 22); }
  if (state === 'over') {
    text('Game Over', 220, 44);
    text('Punkte: ' + score + '   Rekord: ' + best, 280, 22);
    if (frame > 30) text('Tippen für Neustart', 400, 22);
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

addEventListener('pointerdown', e => { e.preventDefault(); flap(); });
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); } });

reset(); loop();
</script>
</body>
</html>
